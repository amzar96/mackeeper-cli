name: Feature request
description: Suggest a new feature or improvement
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tell us what you'd like and why.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the real-world need, not just the feature name.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Menu flow, new category, new flag?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve the problem?
  - type: checkboxes
    id: constraints
    attributes:
      label: Design constraints
      options:
        - label: I understand the tool must stay dependency-free (pure bash 3.2+)
        - label: I understand destructive actions must go through the Trash
