name: Stale issues & PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days and will be closed soon.
            If it's still relevant, please leave a comment to keep it open.
          stale-pr-message: >
            This PR has had no activity for 45 days. If it needs more work,
            please continue; otherwise it may be closed.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if needed.
          close-pr-message: >
            Closing due to inactivity. You can reopen or open a new PR.
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 14
          days-before-pr-close: 21
          stale-issue-label: "status:stale"
          stale-pr-label: "status:stale"
          exempt-issue-labels: "status:help-wanted,status:good-first-issue,security"
          exempt-pr-labels: "dependencies"
