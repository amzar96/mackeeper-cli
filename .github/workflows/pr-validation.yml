name: PR Validation

# Runs on pull_request_target so we can label PRs from EXTERNAL FORKS too.
# This job never checks out or executes the PR's code (no `actions/checkout`,
# no secrets), it only reads PR metadata and writes labels/comments — the safe
# pattern for validating fork contributions.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          head="${{ github.event.pull_request.head.ref }}"
          echo "base=$base head=$head"
          if [ "$base" != "main" ]; then
            echo "::error::PRs must target the 'main' branch (found '$base')."
            exit 1
          fi
          echo "branch OK"

      - name: Validate PR title (Conventional Commits)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title=$TITLE"
          if ! echo "$TITLE" | grep -qE '^(fix|feat|refactor|docs|test|chore|ci|perf|build|revert)(\([a-z-]+\))?!?: '; then
            echo "::error::Title must follow Conventional Commits, e.g. 'fix: describe the change'"
            exit 1
          fi
          echo "title OK"

      - name: Validate PR has changes
        run: |
          changed="${{ github.event.pull_request.changed_files }}"
          echo "changed_files=$changed"
          if [ -z "$changed" ] || [ "$changed" = "0" ]; then
            echo "::error::PR has no changed files."
            exit 1
          fi

      - name: "Warn if the PR also edits CI files (maintainers: review carefully)"
        run: |
          FILES="${{ github.event.pull_request.changed_files }}"
          echo "::notice::PR touches $FILES file(s)"

      - name: Label the PR
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const title = context.payload.pull_request.title;
            let label = 'type:other';
            if (/^fix/.test(title)) label = 'type:bugfix';
            else if (/^feat/.test(title)) label = 'type:feature';
            else if (/^docs/.test(title)) label = 'type:docs';
            else if (/^refactor/.test(title)) label = 'type:refactor';
            else if (/^ci/.test(title)) label = 'type:ci';
            try {
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [label] });
              console.log(`labeled ${label}`);
            } catch (e) {
              console.log('label already exists or add failed:', e.message);
            }
